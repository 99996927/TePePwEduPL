<mat-sidenav-container class="shell">
  <mat-sidenav #sidenav [mode]="narrow() ? 'over' : 'side'" [opened]="!narrow()">
    <nav>
      <mat-nav-list>
        @for (item of items(); track item.path) {
          <a
            mat-list-item
            [routerLink]="item.path"
            routerLinkActive
            #active="routerLinkActive"
            [routerLinkActiveOptions]="{ exact: item.exact }"
            [activated]="active.isActive"
            (click)="closeIfNarrow(sidenav)"
            >{{ item.label }}</a
          >
        }
      </mat-nav-list>
    </nav>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary" class="toolbar">
      @if (narrow()) {
        <button matIconButton type="button" aria-label="Menu" (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <span class="title">Asystent kadrowo-płacowy</span>
      <span class="spacer"></span>
      <span class="user">{{ user()?.displayName }}</span>
      <span class="role">{{ roleLabel() }}</span>
      <button matButton type="button" class="logout" (click)="logout()">Wyloguj</button>
    </mat-toolbar>
    <main class="content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
